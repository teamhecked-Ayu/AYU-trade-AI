<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYU Trade AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div><h1>AYU Trade AI</h1><p>Paper trading dashboard</p></div><span id="status" class="status">Checking API...</span></header><section class="card settings"><h2>Connection</h2><input id="apiBase" value="http://localhost:8000"><input id="apiKey" type="password" placeholder="API key"><button id="connect">Connect</button></section><section class="grid"><article class="card"><h2>Paper Cash</h2><strong id="cash">-</strong></article><article class="card"><h2>Positions</h2><strong id="positionCount">-</strong></article><article class="card"><h2>Trades</h2><strong id="tradeCount">-</strong></article></section><section class="card"><h2>Paper Order</h2><form id="orderForm"><input id="symbol" value="BTC/USDT" required><select id="side"><option value="buy">Buy</option><option value="sell">Sell</option></select><input id="quantity" type="number" min="0.00000001" step="any" placeholder="Quantity" required><input id="price" type="number" min="0.00000001" step="any" placeholder="Price" required><button type="submit">Submit Paper Order</button></form><p id="message"></p></section><section class="card"><h2>Portfolio</h2><pre id="portfolio">Connect to load portfolio.</pre></section></main><script src="app.js"></script></body></html>
