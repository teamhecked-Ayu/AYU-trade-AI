name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile Python modules
        run: python -m compileall -q api ayuai core paper_api.py
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Run tests
        run: python -m pytest tests -q
      - name: Start Docker Compose stack
        run: docker compose up --build --detach
      - name: Verify full Compose runtime
        run: docker compose exec -T ayu-trade-ai python scripts/compose_smoke.py
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
