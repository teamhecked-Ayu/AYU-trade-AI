services:
  ayu-trade-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PAPER_TRADE: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ayuai:change-me-in-production@postgres:5432/ayuai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ayuai
      POSTGRES_USER: ayuai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
